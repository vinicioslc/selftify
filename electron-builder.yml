appId: com.selftify.app
productName: Selftify
copyright: Copyright © 2025 Selftify

directories:
  output: dist
  buildResources: buildResources

files:
  - out/**/*
  - "!node_modules/**/*"
  - node_modules/**/*.node
  - node_modules/better-sqlite3/**/*
  - node_modules/music-metadata/**/*
  - node_modules/sql.js/**/*

asarUnpack:
  - "**/*.node"
  - node_modules/better-sqlite3/**
  - node_modules/sql.js/**
  - node_modules/music-metadata/**

extraResources:
  - from: buildResources/
    to: buildResources/
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: buildResources/icon.ico
  artifactName: "${productName}-${version}-Setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  uninstallDisplayName: "Selftify ${version}"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: buildResources/icon.icns
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: public.app-category.music

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: buildResources/
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: Audio
